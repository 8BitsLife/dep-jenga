# Render Blueprint for the DepJenga API (Spring Boot, built from backend/Dockerfile).
# New > Blueprint in the Render dashboard, pick this repo, then fill in the values marked sync: false.
services:
  - type: web
    name: depjenga-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      # Browser origins allowed to call the API. Wildcards work, so this default covers every Vercel
      # deployment; tighten it to your production domain if you like.
      - key: ALLOWED_ORIGINS
        value: https://*.vercel.app,http://localhost:5173
      # Optional but strongly recommended: raises the GitHub API limit from 60 to 5000 requests/hour.
      # A fine-grained token with no extra permissions (public repositories, read-only) is enough.
      - key: GITHUB_TOKEN
        sync: false
