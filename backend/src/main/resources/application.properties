server.port=${PORT:8080}
spring.threads.virtual.enabled=true
spring.mvc.async.request-timeout=300000
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# Optional: a GitHub token raises the GitHub API rate limit from 60/h to 5000/h
# and enables GitHub Advisory Database enrichment for every advisory.
depjenga.github-token=${GITHUB_TOKEN:}
# Comma-separated allowed browser origins for CORS; wildcards such as https://*.vercel.app are allowed.
# The Vite dev server proxies /api, so in production set this to the deployed frontend's origin.
depjenga.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
# Safety caps so a giant monorepo cannot run away with the public APIs
depjenga.max-packages=600
depjenga.max-manifests=10
